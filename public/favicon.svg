<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark navy radial background -->
    <radialGradient id="biz-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#162038" />
      <stop offset="60%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>

    <!-- Part 1 Emerald Gradient -->
    <linearGradient id="biz-emerald-1" x1="25%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Part 2 Emerald Facet Gradient -->
    <linearGradient id="biz-emerald-2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle neon ambient drop shadow -->
    <filter id="emblem-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Circular Dark Navy Base -->
  <circle cx="60" cy="60" r="56" fill="url(#biz-bg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 2. Part 1: Main Chevron Apex, Left Leg & Crossbar -->
  <path
    d="M60 23.5 L84.5 53.5 L69 53.5 L60 41.5 L46.5 63 L69.5 63 L69.5 76 L38.5 76 L33 95 L19.5 95 Z"
    fill="url(#biz-emerald-1)"
    filter="url(#emblem-glow)"
  />

  <!-- 3. Part 2: Lower Right Geometric Leg -->
  <polygon
    points="73.5,63 87.5,63 99,95 85,95"
    fill="url(#biz-emerald-2)"
  />
</svg>
