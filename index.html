<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SanjuFinance" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <title>Sanjeewa — Personal Finance &amp; Expense Tracker</title>
    <meta name="description" content="Offline-first personal finance app to track salary, income, expenses, and cards for Sanjeewa. Works without internet and syncs automatically." />

    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root">
      <!-- Instant splash — visible before JS loads -->
      <div id="app-splash" style="
        position:fixed;inset:0;background:#0f172a;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        z-index:9999;
      ">
        <img src="/pwa-192x192.png" width="72" height="72"
          style="border-radius:50%;margin-bottom:20px;
                 box-shadow:0 0 40px rgba(16,185,129,0.3);
                 border:2px solid rgba(16,185,129,0.3);"
          alt="Sanjeewa Finance" />
        <div style="
          width:32px;height:32px;
          border:3px solid rgba(16,185,129,0.2);
          border-top-color:#10b981;
          border-radius:50%;
          animation:spin .8s linear infinite;
        "></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      /* Hide Netlify Badge safely */
      div[style*="z-index: 2147483647"] { display: none !important; }
    </style>
  </body>
</html>
